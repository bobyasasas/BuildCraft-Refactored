pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

// M1.1: expression 表达式库已拆为独立纯 Java 子项目（java-library，无 MC/Forge 依赖）
include ':expression'
project(':expression').projectDir = file('sub_projects/expression')

// M1.1: BuildCraftAPI 已拆为独立 ForgeGradle 子项目。projectDir 指向 git 子模块目录
// （该目录内零写入零修改，保持子模块工作树 clean）；buildFileName 指到仓库根侧的
// buildcraftapi.build.gradle——既承载全部构建配置，又避免执行子模块自带的上游构建脚本
include ':buildcraftapi'
project(':buildcraftapi').projectDir = file('BuildCraftAPI')
project(':buildcraftapi').buildFileName = '../buildcraftapi.build.gradle'

