# Standalone build properties for the NeoForge 26.1.2 port (task M2.1).
# Kept separate from the legacy root gradle.properties on purpose.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# Environment Properties
# The Minecraft version must agree with the Neo version to get a valid artifact
# The Minecraft version range can use any release version of Minecraft as bounds.
# [26.1] (the MDK default) hard-pins 26.1 and rejects the current 26.1.2 game,
# so allow any 26.1.x patch release instead.
minecraft_version=26.1
minecraft_version_range=[26.1,26.2)
neo_version=26.1.2.109

# Optional compat integrations: compileOnly against their APIs, never required
# at runtime. Versions are the single source of truth for the neo/build.gradle
# coordinates below (jei_mc is the Minecraft-version segment of the JEI
# artifact ids, which must match minecraft_version above).
jei_mc=26.1.2
jei_version=29.37.0.99
jade_version=26.1.11+neoforge

## Mod Properties
mod_id=buildcraftcore
mod_name=BuildCraft Core
mod_license=MPL-2.0
mod_version=26.1.2-0.1.0
mod_group_id=com.mod-buildcraft
