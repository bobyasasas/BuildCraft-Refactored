// Standalone Gradle build for the NeoForge 26.1.2 port (task M2.1).
// Deliberately NOT included from the root settings.gradle: the legacy 1.20.1
// ForgeGradle build and this ModDevGradle build live side by side, each driven
// by its own wrapper (root: Gradle 8.8, this: Gradle 9.1.0).

pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = uri('https://maven.neoforged.net/releases')
        }
    }
}

plugins {
    // This plugin allows Gradle to automatically download arbitrary versions of Java for you
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'buildcraft-neo'
