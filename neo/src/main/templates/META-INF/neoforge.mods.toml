license="${mod_license}"

# M2.4a: the eight legacy BuildCraft mods ship from this single jar, mirroring
# mod_info/META-INF/mods.toml (1.20.1). Descriptions are the legacy ones.

[[mods]]
modId="buildcraftlib"
version="${mod_version}"
displayName="BuildCraft Lib"
description='''
Library mod used by buildcraft (NeoForge 26.1.2 port skeleton).
'''

[[mods]]
modId="buildcraftcore"
version="${mod_version}"
displayName="BuildCraft"
description='''
Extending Minecraft with pipes, auto-crafting, quarries, engines and much more! (NeoForge 26.1.2 port skeleton)
'''

[[mods]]
modId="buildcraftbuilders"
version="${mod_version}"
displayName="BuildCraft Builders"
description='''
Extending Minecraft with pipes, auto-crafting, quarries, engines and much more! (Builders Component)
'''

[[mods]]
modId="buildcraftenergy"
version="${mod_version}"
displayName="BuildCraft Energy"
description='''
Extending Minecraft with pipes, auto-crafting, quarries, engines and much more! (Energy Component)
'''

[[mods]]
modId="buildcraftfactory"
version="${mod_version}"
displayName="BuildCraft Factory"
description='''
Extending Minecraft with pipes, auto-crafting, quarries, engines and much more! (Factory Component)
'''

[[mods]]
modId="buildcraftsilicon"
version="${mod_version}"
displayName="BuildCraft Silicon"
description='''
Extending Minecraft with pipes, auto-crafting, quarries, engines and much more! (Silicon Component)
'''

[[mods]]
modId="buildcrafttransport"
version="${mod_version}"
displayName="BuildCraft Transport"
description='''
Extending Minecraft with pipes, auto-crafting, quarries, engines and much more! (Transport Component)
'''

[[mods]]
modId="buildcraftrobotics"
version="${mod_version}"
displayName="BuildCraft Robotics"
description='''
Extending Minecraft with pipes, auto-crafting, quarries, engines and much more! (Robotics Component)
'''

# Every mod requires neoforge + minecraft; every mod except buildcraftlib itself
# depends on buildcraftlib and loads after it (legacy dependency layout).

[[dependencies.buildcraftlib]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.buildcraftlib]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.buildcraftcore]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.buildcraftcore]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.buildcraftcore]]
    modId="buildcraftlib"
    type="required"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Optional compat integrations (buildcraftlib-era BuildCraft 8 did the same):
# JEI + Jade are never required; when present we just load after them so their
# plugin discovery (FML annotation scan) has already initialized them.
[[dependencies.buildcraftcore]]
    modId="jei"
    type="optional"
    versionRange="[29,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.buildcraftcore]]
    modId="jade"
    type="optional"
    versionRange="[26.1,)"
    ordering="AFTER"
    side="BOTH"

