// Standalone ModDevGradle build for the NeoForge 26.1.2 port (task M2.1).
// This build is independent of the legacy root ForgeGradle build: it has its
// own settings.gradle and wrapper and is NOT wired into the root settings.gradle.

plugins {
    id 'java-library'
    id 'jacoco'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// M2.4a: all eight legacy BuildCraft mods ship from this single jar (see
// src/main/templates/META-INF/neoforge.mods.toml). mod_id/gradle.properties stays
// pinned to buildcraftcore as the archive name; the list below drives everything
// that is per-mod in ModDevGradle.
def buildcraft_mod_ids = ['buildcraftlib', 'buildcraftcore', 'buildcraftbuilders', 'buildcraftenergy',
                          'buildcraftfactory', 'buildcraftsilicon', 'buildcrafttransport', 'buildcraftrobotics']

// Mojang ships Java 25 to end users in 26.1, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// M2.7a: client source set split (also closes the M1.2 deferral on the new tree).
// src/client/java + src/client/resources hold client-only classes (rendering, fluid
// models, screens). The boundary is enforced structurally, not by dist guards:
// - client -> main is allowed (clientCompileClasspath includes main.output below);
// - main -> client is impossible: main's classpath never sees src/client output
//   (verified by `grep -rn "buildcraft.lib.client" src/main/java` = 0).
// The client source set joins the run classpath via neoForge.runs below (only the
// client run) and is packaged into the shipped jar by the tasks.jar tweak.
sourceSets {
    client {
    }
}

// Give the client source set the same main classes/deps the main source set sees:
// - main's output comes from the explicit classpath additions below;
// - Gradle does NOT auto-wire custom source sets to the shared configurations (only
//   testImplementation gets that treatment), so the three extendsFrom here are what
//   put main's `implementation` dependencies (e.g. :expression) and any compile-only/
//   runtime-only deps on the client classpaths. Without them the client run boots
//   without the expression jar and mod construction dies in NoClassDefFoundError.
// - the neoforge/minecraft artifacts are wired after the neoForge { } block below
//   via `addModdingDependenciesTo` (it must run after the workflow exists).
configurations {
    clientImplementation.extendsFrom implementation
    clientCompileOnly.extendsFrom compileOnly
    clientRuntimeOnly.extendsFrom runtimeOnly
}
sourceSets.client.compileClasspath += sourceSets.main.output
sourceSets.client.runtimeClasspath += sourceSets.main.output

dependencies {
    // M2.3: wire the pure-logic expression library (Java 17 toolchain, no MC deps)
    // into the mod classpath. Staying on 17 is deliberate: the legacy 1.20.1 fat
    // jar packages these class files and must remain Java 17 loadable (major 61).
    implementation project(':expression')

    // M2.5: codec round-trip tests for the 16 payload classes. MDG's unitTest is
    // enabled below ONLY to put the minecraft/neoforge jars on the test compile
    // classpath; the tests themselves stay plain JUnit 4.12 (same version as
    // :expression) on the default JUnit4 runner. NeoForge 26.1.2 cannot
    // Bootstrap.bootStrap() on a plain JUnit JVM (FeatureFlagLoader needs FML), so
    // the test payload classes are deliberately registry-free (no Component /
    // ChunkPos anywhere a codec touches), and booting FML's junit
    // LauncherSessionListener does not help either — FML 26.1 keeps only one mod
    // file per modid, so the test classes of the tested mod are never visible to
    // its ModuleClassLoader. The fml.* system properties unitTest injects are
    // inert when FML is never started.
    testImplementation 'junit:junit:4.12'
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    runs {
        // M2.7a: the client run uses the client source set as its runtime classpath
        // (which transitively contains main.output, see the wiring above), so client
        // classes are loadable in dev-run clients.
        client {
            client()
            sourceSet = sourceSets.client
            // TEMP M2.7b evidence (to be reverted): quickPlay straight into the scratch save.
            programArgument '--quickPlaySingleplayer'
            programArgument 'gametestworld'
        }

        // M2.7a: server-side runs stay on the main source set's runtime classpath —
        // src/client output is NOT on their game classpath. (MDG's mods { } block is
        // project-global, so fml.modFolders still lists the client output folder on
        // server runs — upstream MDG issue #309. That is harmless: FML only bytecode
        // scans those folders, nothing on the server ever loads a client class, and
        // the client entry point is dist-filtered at scan level, see
        // BuildCraftEnergyClient. The classpath boundary itself is enforced here.)
        server {
            server()
            programArgument '--nogui'
            sourceSet = sourceSets.main
            // M2.8 oil worldgen verification probe (OilWorldgenProbe): default scan radius for dedicated server
            // runs; override with -Poilscan.radius=<n> (0 disables the probe).
            systemProperty 'buildcraft.oilscan.radius', (project.findProperty('oilscan.radius') ?: '32')
        }

        // M2.2a: headless NeoForge gametest server (run type from the NeoForge moddev-config:
        // main net.neoforged.fml.startup.GameTestServer, neoforge.enableGameTest=true).
        // The selector keeps the run focused on our own tests instead of vanilla's full suite.
        gameTestServer {
            type = 'gameTestServer'
            programArgument '--tests'
            programArgument 'buildcraftcore:*'
            sourceSet = sourceSets.main
            // M2.8: keep the worldgen probe off here (the gametest world must not spend its short lifetime
            // force-loading a scan area).
            systemProperty 'buildcraft.oilscan.radius', '0'
            // M3.3: runtime registry dump probe (RegistryDumpProbe): writes the 26.1.2 registry dump to the given
            // file when -Pregistrydump.path=<file> is passed; default (empty) keeps the probe off so plain runs
            // and the M3.1 GameTests CI step are unaffected.
            systemProperty 'buildcraft.registrydump.path', (project.findProperty('registrydump.path') ?: '')
        }

        // M3.4: data generation (runData). The 26.1.2.109 userdev config has no plain "data" run type; the
        // headless generator is "serverData" (main net.neoforged.fml.startup.DataServer -> vanilla
        // net.minecraft.data.Main). Output goes to a standalone directory (build/datagen) so the result can be
        // diffed against src/main/resources WITHOUT ever touching it (M3.4 no-drift gate); --flat keeps every
        // mod namespace under one tree. The data run never reads or writes the shipped resources.
        data {
            type = 'serverData'
            sourceSet = sourceSets.main
            programArgument '--flat'
            programArgument '--mod'
            programArgument 'buildcraftlib,buildcraftcore,buildcraftbuilders,buildcraftenergy,buildcraftfactory,buildcraftsilicon,buildcrafttransport,buildcraftrobotics'
            programArgument '--output'
            programArgument 'datagen'
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/removed as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Console log level for dev runs
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // M2.4a: one entry per shipped mod, all bound to the same source set so dev
        // runs expose the mod code/resources under every modid (MDG builds the
        // MOD_CLASSES argument from these).
        // M2.7a: each entry now binds main + client so the client run sees the client
        // source set's classes/resources under its own modids.
        buildcraft_mod_ids.each { id ->
            "$id" {
                sourceSet(sourceSets.main)
                sourceSet(sourceSets.client)
            }
        }
    }

    // M2.5: puts the minecraft/neoforge jars on the test sourceSet compile classpath
    // (needed because the payloads' wire types reference BlockPos/Identifier/...).
    // We do NOT rely on its FML junit boot (see the dependency comment above) —
    // the injected fml.* system properties are inert under the plain JUnit4 runner.
    unitTest {
        enable()
        testedMod = mods.buildcraftlib
    }
}

// M2.7a: wire the neoforge/minecraft artifacts onto the client source set's compile
// and runtime classpath configurations. This must run AFTER the `neoForge { }`
// block: it resolves MDG's internal artifacts workflow, which is created when the
// version is set. (Mirrors what MDG does for the source sets enabled by default.)
neoForge.addModdingDependenciesTo sourceSets.client

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// M2.7a: ship the client source set's classes/resources inside the mod jar (the
// default `jar` only packages sourceSets.main.output). Split-source-set mods that
// forget this ship without their client code — the dev runs would still work
// (they read the output folders), but production installs would lose it.
tasks.jar {
    from sourceSets.client.output
    // M3.9: inline the shared expression library classes into the shipped jar to
    // match the legacy 1.20.1 fat-jar packaging; dev classpath already had them
    // via implementation, production launch did not (NoClassDefFoundError reproduced).
    from({ project(':expression').sourceSets.main.output })
}

// M3.6: JaCoCo line coverage gate for the core packages (buildcraft.core.* and
// buildcraft.lib.*). The stock JavaPlugin `test` task is the unit-test task here
// (MDG's unitTest.enable() only puts the minecraft/neoforge jars on the test
// classpath, see the M2.5 comment above), so the jacoco plugin's automatic agent
// wiring onto `test` is exactly right — no extra attach needed. Reports go to
// build/reports/jacoco/ as XML (consumed by the gate + CI step) and HTML.
jacoco {
    // Gradle 9.1's bundled default, pinned for visibility. Per the upstream
    // changelog (0.8.13, 2025/04/02) this release "officially supports Java 23
    // and Java 24" and adds "Experimental support for Java 25 class files" —
    // required here because the toolchain compiles to Java 25 (major 69). It is
    // also the newest org.jacoco release on Maven Central, so there was nothing
    // to upgrade to.
    toolVersion = '0.8.13'
}

jacocoTestReport {
    reports {
        xml.required = true   // consumed by the gate below + the CI M3.6 step
        html.required = true  // human-readable, build/reports/jacoco/test/html
    }
}

// M3.6 thresholds. The gate is defined on the two core package FAMILIES as an
// aggregate (per the M3.6 mandate "core packages = buildcraft.core.* +
// buildcraft.lib.*"). JaCoCo's stock jacocoTestCoverageVerification cannot
// express that: its PACKAGE-element rules apply the minimum to EVERY matching
// package individually, and several packages inside both families are at 0% by
// design (unit tests never load them — they cover the payload codec /
// datacomponent / net-message slice). So the equivalent mechanism here is a
// custom verifier over the jacocoTestReport XML that sums missed/covered lines
// per family. Floors are the measured M3.6 baseline (see git history of this
// file / tasks.json M3.6 evidence) rounded DOWN with a 1-2 percentage point
// buffer against jitter:
//   buildcraft.core.* : 3.37%  (20/594 lines)  -> floor 2%
//   buildcraft.lib.*  : 74.61% (620/831 lines) -> floor 73%
// Not symbolic: dipping below a floor means covered core lines were lost or
// large untested code landed in a family, and `check` (CI Build step) and the
// dedicated CI M3.6 step both go red.
def corePackageFamilyFloors = [
        // family prefix (dot form) : minimum aggregate LINE covered ratio
        'buildcraft.core': 0.02,
        'buildcraft.lib' : 0.73,
]

tasks.register('jacocoCoreCoverageVerification') {
    group = 'verification'
    description = 'M3.6: fails when a core package family (buildcraft.core.*/buildcraft.lib.*) ' +
            'drops below its aggregate line coverage floor.'
    dependsOn tasks.jacocoTestReport
    doLast {
        def xmlFile = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile
        if (!xmlFile.isFile()) {
            throw new GradleException('M3.6 gate: jacoco XML report missing at ' + xmlFile)
        }
        // JAXP DOM instead of Groovy XmlParser: the jacoco XML carries a DOCTYPE
        // declaration which the script classloader's hardened parser rejects.
        // External entity resolution stays off — only the internal DTD is ignored.
        def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        factory.setFeature('http://xml.org/sax/features/external-general-entities', false)
        factory.setFeature('http://xml.org/sax/features/external-parameter-entities', false)
        factory.setFeature('http://apache.org/xml/features/nonvalidating/load-external-dtd', false)
        def doc = factory.newDocumentBuilder().parse(xmlFile).documentElement

        def collectCounters = { org.w3c.dom.Node parent ->
            def out = [:]
            def nl = parent.getElementsByTagName('counter')
            for (int i = 0; i < nl.getLength(); i++) {
                def n = nl.item(i)
                out[n.getAttribute('type')] = [missed: n.getAttribute('missed') as long,
                                               covered: n.getAttribute('covered') as long]
            }
            out
        }

        def overall = [missed: 0L, covered: 0L]
        def families = corePackageFamilyFloors.collectEntries { key, _ -> [key, [missed: 0L, covered: 0L]] }
        def pkgList = doc.getElementsByTagName('package')
        for (int i = 0; i < pkgList.getLength(); i++) {
            def pkg = pkgList.item(i)
            def name = pkg.getAttribute('name')
            def lineCounter = collectCounters(pkg)['LINE']
            if (lineCounter == null) continue
            overall.missed += lineCounter.missed
            overall.covered += lineCounter.covered
            def family = corePackageFamilyFloors.keySet().find {
                def slashForm = it.replace('.', '/')
                name == slashForm || name.startsWith(slashForm + '/')
            }
            if (family != null) {
                families[family].missed += lineCounter.missed
                families[family].covered += lineCounter.covered
            }
        }
        def summary = []
        def failed = false
        families.each { family, cnt ->
            long total = cnt.missed + cnt.covered
            double pct = total == 0L ? 0.0d : (cnt.covered * 100.0d / total)
            double floorPct = corePackageFamilyFloors[family] * 100.0d
            def ok = pct >= floorPct - 1e-9
            failed |= !ok
            summary << String.format('  %-18s lines %5d/%-5d line coverage %5.2f%% (floor %4.1f%%) %s',
                    family, cnt.covered, total, pct, floorPct, ok ? 'OK' : 'BELOW FLOOR')
        }
        long totalAll = overall.missed + overall.covered
        double pctAll = totalAll == 0L ? 0.0d : (overall.covered * 100.0d / totalAll)
        summary << String.format('  %-18s lines %5d/%-5d line coverage %5.2f%% (informational)',
                'overall', overall.covered, totalAll, pctAll)
        logger.lifecycle('M3.6 core package line coverage gate:')
        summary.each { logger.lifecycle(it) }
        if (failed) {
            throw new GradleException('M3.6 core package coverage gate FAILED:\n' + summary.join('\n'))
        }
    }
}

// Keep the gate live for every `check`/`build` invocation (CI Build step and
// local builds), not only for the dedicated CI M3.6 step.
tasks.named('check') {
    dependsOn tasks.jacocoCoreCoverageVerification
}
