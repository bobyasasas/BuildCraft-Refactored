// Standalone ModDevGradle build for the NeoForge 26.1.2 port (task M2.1).
// This build is independent of the legacy root ForgeGradle build: it has its
// own settings.gradle and wrapper and is NOT wired into the root settings.gradle.

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// M2.4a: all eight legacy BuildCraft mods ship from this single jar (see
// src/main/templates/META-INF/neoforge.mods.toml). mod_id/gradle.properties stays
// pinned to buildcraftcore as the archive name; the list below drives everything
// that is per-mod in ModDevGradle.
def buildcraft_mod_ids = ['buildcraftlib', 'buildcraftcore', 'buildcraftbuilders', 'buildcraftenergy',
                          'buildcraftfactory', 'buildcraftsilicon', 'buildcrafttransport', 'buildcraftrobotics']

// Mojang ships Java 25 to end users in 26.1, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

dependencies {
    // M2.3: wire the pure-logic expression library (Java 17 toolchain, no MC deps)
    // into the mod classpath. Staying on 17 is deliberate: the legacy 1.20.1 fat
    // jar packages these class files and must remain Java 17 loadable (major 61).
    implementation project(':expression')

    // M2.5: codec round-trip tests for the 16 payload classes. MDG's unitTest is
    // enabled below ONLY to put the minecraft/neoforge jars on the test compile
    // classpath; the tests themselves stay plain JUnit 4.12 (same version as
    // :expression) on the default JUnit4 runner. NeoForge 26.1.2 cannot
    // Bootstrap.bootStrap() on a plain JUnit JVM (FeatureFlagLoader needs FML), so
    // the test payload classes are deliberately registry-free (no Component /
    // ChunkPos anywhere a codec touches), and booting FML's junit
    // LauncherSessionListener does not help either — FML 26.1 keeps only one mod
    // file per modid, so the test classes of the tested mod are never visible to
    // its ModuleClassLoader. The fml.* system properties unitTest injects are
    // inert when FML is never started.
    testImplementation 'junit:junit:4.12'
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // M2.2a: headless NeoForge gametest server (run type from the NeoForge moddev-config:
        // main net.neoforged.fml.startup.GameTestServer, neoforge.enableGameTest=true).
        // The selector keeps the run focused on our own tests instead of vanilla's full suite.
        gameTestServer {
            type = 'gameTestServer'
            programArgument '--tests'
            programArgument 'buildcraftcore:*'
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/removed as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Console log level for dev runs
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // M2.4a: one entry per shipped mod, all bound to the same source set so dev
        // runs expose the mod code/resources under every modid (MDG builds the
        // MOD_CLASSES argument from these).
        buildcraft_mod_ids.each { id ->
            "$id" {
                sourceSet(sourceSets.main)
            }
        }
    }

    // M2.5: puts the minecraft/neoforge jars on the test sourceSet compile classpath
    // (needed because the payloads' wire types reference BlockPos/Identifier/...).
    // We do NOT rely on its FML junit boot (see the dependency comment above) —
    // the injected fml.* system properties are inert under the plain JUnit4 runner.
    unitTest {
        enable()
        testedMod = mods.buildcraftlib
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
