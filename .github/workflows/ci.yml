name: CI

on:
  push:
    branches: [neoforge-26.1.2]
  pull_request:
    branches: [neoforge-26.1.2]

# 同一分支/PR 的新推送取消仍在跑的旧 CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 校验 migration/tasks.json 的结构、状态枚举与 done 任务的 evidence 完整性
  progress-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run progress check
        run: python3 migration/scripts/progress.py --check

  # M0.2 完成前本 job 允许失败属预期（让基线构建变绿就是任务 M0.2），M0.2 完成后必须绿
  baseline-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # 本项目 BuildCraftAPI 等三个子模块是编译必需
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      # M1.3: 覆盖率基线——build 已含 test，这里只产出 JaCoCo 报告（基线阶段不上门禁，M3.6 才设阈值）
      - name: Coverage report
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/
          retention-days: 14

  # M2.1: 并行的 NeoForge 26.1.2 独立构建（neo/，ModDevGradle），不依赖子模块
  neo-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 守护进程跑在 21 上；构建用的 Java 25 工具链由 foojay-resolver 自动下载
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build
        run: cd neo && ./gradlew build --stacktrace --no-daemon
