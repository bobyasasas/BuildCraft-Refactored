name: CI

on:
  push:
    branches: [neoforge-26.1.2]
  pull_request:
    branches: [neoforge-26.1.2]

# 同一分支/PR 的新推送取消仍在跑的旧 CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 校验 migration/tasks.json 的结构、状态枚举与 done 任务的 evidence 完整性
  progress-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run progress check
        run: python3 migration/scripts/progress.py --check

  # M2.1: 并行的 NeoForge 26.1.2 独立构建（neo/，ModDevGradle），不依赖子模块
  neo-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # M3.8: 仅本 job 提升 token 权限用于趋势记录回写仓库（push migration/trends/），
    # progress-check job 不受影响，仍按顶层 permissions 保持 contents: read。
    # M2.9: baseline-build job 随 legacy 树删除而退役——其守护对象（冻结 1.20.1 基线构建）由
    # 基线分支 8.0.x-1.20.1 永久承载，本分支不再构建 legacy 代码。
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 守护进程跑在 21 上；构建用的 Java 25 工具链由 foojay-resolver 自动下载
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build
        run: cd neo && ./gradlew build --stacktrace --no-daemon

      # M3.1: headless GameTests（gameTestServer run，选择器 buildcraftcore:*）。
      # 注意成败判定不能依赖 gradle 退出码：FML 的 net.neoforged.fml.startup.GameTestServer
      # 入口只有启动异常才 System.exit(1)，测试失败时 JVM 正常返回（已核对 loader 11.0.15 字节码）。
      # 因此以 GameTestServer 日志为权威信号（26.1 实际格式）：
      #   总数 = "Each test that matches ... will be run N times (total: M)"（兜底 "M GAME TESTS COMPLETE"）
      #   通过 = "All M required tests passed :)"（26.1 中通过用例不逐条打日志，失败用例才有 ERROR 行）
      #   解析不到通过行（含中途崩溃/环境故障）一律按 0/N 处理并以非零码退出，步骤变红。
      - name: GameTests (headless)
        timeout-minutes: 15
        run: |
          cd neo
          set -o pipefail
          rc=0
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee /tmp/gametest.log || rc=$?
          GT_GRADLE_RC="$rc" python3 - <<'PYEOF'
          import os, re, sys

          with open('/tmp/gametest.log', encoding='utf-8', errors='replace') as f:
              log = f.read()

          m_total = re.search(r'will be run \d+ times \(total: (\d+)\)', log)
          m_complete = re.search(r'=+ (\d+) GAME TESTS COMPLETE IN ', log)
          m_pass = re.search(r'All (\d+) required tests passed', log)

          total = int(m_total.group(1)) if m_total else (int(m_complete.group(1)) if m_complete else 0)
          passing = int(m_pass.group(1)) if m_pass else 0
          gradle_rc = int(os.environ.get('GT_GRADLE_RC', '1'))

          # 成功需同时满足：gradle 退出码 0 且日志出现 "All N required tests passed"（N == 总数）
          ok = gradle_rc == 0 and m_pass is not None and total > 0 and passing == total

          # 统计行 + 日志原文证据（汇总行；失败用例的 "xxx failed at ..." ERROR 行与 "- id: error" 清单行）
          out = ['GameTests: %d/%d passing' % (passing, total)]
          for raw in log.splitlines():
              text = raw.split(']: ', 1)[-1].rstrip()
              keep = ('GAME TESTS COMPLETE IN' in text
                      or 'required tests' in text
                      or 'optional tests failed' in text
                      or re.search(r'\S+ failed at ', text)
                      or re.match(r'\s*- \S+: ', text))
              if keep and text and text not in out:
                  out.append('> ' + text)
          out.append('')

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write('\n'.join(out) + '\n')
          print('\n'.join(out))
          sys.exit(0 if ok else 1)
          PYEOF
          exit $?

      # M3.3: registry dump + 与冻结 1.20.1 基线对拍。流程：带 -Pregistrydump.path 重跑 runGameTestServer
      # （RegistryDumpProbe 在 ServerStartedEvent 把 26.1.2 运行时注册表落盘成与基线同 schema 的 JSON：
      #   五类注册表 + recipes + tags），再跑 migration/scripts/registry_diff.py 判定：
      #   - 五类注册表：missing=0 且 extra=0（按 RegistryParityTest.EXTRA_WHITELIST 的 4 个 M2.2 垂直切片
      #     id 扣除后）才绿，与 buildcraftcore:registry_parity gametest 语义逐字一致；
      #   - recipes/tags：M2.10（内容资产迁移）收口起带 --strict——recipes/tags 与五类同口径
      #     fail-closed（missing/白名单外 extra 必须为 0），完整 diff 输出仍打进 $GITHUB_STEP_SUMMARY。
      # fail-closed：gradle 失败、dump 证据行缺失、diff 退出码非零，任一都让本步骤变红。
      - name: Registry parity diff vs 1.20.1 baseline (M3.3)
        timeout-minutes: 15
        run: |
          cd neo
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon -Pregistrydump.path="$PWD/build/registry-dump-26.1.2.json" 2>&1 | tee /tmp/registrydump.log
          dump_rc=$?
          if [ "$dump_rc" -ne 0 ]; then
            echo "runGameTestServer (registry dump) failed rc=$dump_rc" >&2
            exit 1
          fi
          grep -q "Registry dump written:" /tmp/registrydump.log || {
            echo "registry dump evidence line missing (probe did not write the dump)" >&2
            exit 1
          }
          cd ..
          python3 migration/scripts/registry_diff.py neo/build/registry-dump-26.1.2.json migration/snapshots/registry-baseline.json --strict | tee /tmp/registrydiff.txt
          diff_rc=${PIPESTATUS[0]}
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "### M3.3 registry parity (26.1.2 runtime vs frozen 1.20.1 baseline, --strict since M2.10)"
              echo '```'
              cat /tmp/registrydiff.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $diff_rc

      # M3.5: 语言键对拍——BuildCraft-Localization 基线 en_us.json（子模块，只读）的键集合 vs
      # neo 侧 8 个 modid assets/<modid>/lang/en_us.json 的键集合并集。
      # missing（基线有、neo 无）与 extra（neo 有、基线无）白名单外都必须为 0 才绿；只对拍键集合，
      # 不比文案。子模块只取 BuildCraft-Localization 一个（本 job 其余步骤不依赖子模块，避免全量 init）。
      # fail-closed：基线/资产缺失、JSON 非法、重复键都按 lang_diff.py exit 2 非零退出，步骤变红。
      - name: Language key parity vs BuildCraft-Localization baseline (M3.5)
        timeout-minutes: 5
        run: |
          git submodule update --init BuildCraft-Localization
          python3 migration/scripts/lang_diff.py | tee /tmp/langdiff.txt
          diff_rc=${PIPESTATUS[0]}
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "### M3.5 language key parity (neo assets vs BuildCraft-Localization baseline)"
              echo '```'
              cat /tmp/langdiff.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $diff_rc

      # M3.6: JaCoCo 核心包行覆盖率门禁。neo 侧单测（payload codec / datacomponent / net 消息）
      # 挂 0.8.13 agent（官方 Java 23/24 + 实验性 Java 25 class 文件支持）产报告，再由
      # jacocoCoreCoverageVerification（build.gradle 里的等价校验 task，已挂 check）按 family 聚合
      # 判定行覆盖率下限：buildcraft.core.* >= 2%（基线 3.37% 向下取整留 1.37pp 缓冲）、
      # buildcraft.lib.* >= 73%（基线 74.61% 向下取整留 1.61pp 缓冲）。低于阈值 gradle 非零退出，
      # 本步骤随之变红（门禁有效性已在 M3.6 验证：人为抬高阈值 50pp 必失败）。
      # fail-closed：gradle 失败、XML 报告缺失、LINE counter 解析不出，任一都非零退出。
      - name: Core package line coverage gate (M3.6)
        timeout-minutes: 15
        run: |
          cd neo
          set -o pipefail
          ./gradlew test jacocoTestReport jacocoCoreCoverageVerification --no-daemon 2>&1 | tee /tmp/coverage.log
          gradle_rc=${PIPESTATUS[0]}
          if [ "$gradle_rc" -ne 0 ]; then
            echo "M3.6 coverage gate failed in gradle, rc=$gradle_rc" >&2
            exit 1
          fi
          python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET
          import os, sys

          xml_path = 'build/reports/jacoco/test/jacocoTestReport.xml'
          floors = {'buildcraft.core': 2.0, 'buildcraft.lib': 73.0}  # 与 build.gradle 的门禁下限一致

          try:
              root = ET.parse(xml_path).getroot()
          except OSError as e:
              print(f'M3.6 coverage summary: cannot read jacoco XML: {e}', file=sys.stderr)
              sys.exit(1)

          def line_counter(el):
              for c in el.findall('counter'):
                  if c.get('type') == 'LINE':
                      return int(c.get('missed')), int(c.get('covered'))
              return None

          overall = line_counter(root)
          if overall is None:
              print('M3.6 coverage summary: report-level LINE counter missing', file=sys.stderr)
              sys.exit(1)

          fams = {k: [0, 0] for k in floors}
          for pkg in root.findall('package'):
              name = pkg.get('name') or ''
              lc = line_counter(pkg)
              if lc is None:
                  continue
              for f in fams:
                  slash = f.replace('.', '/')
                  if name == slash or name.startswith(slash + '/'):
                      fams[f][0] += lc[0]
                      fams[f][1] += lc[1]
                      break

          rows = []
          ok = True
          for f, (missed, covered) in fams.items():
              total = missed + covered
              pct = covered * 100.0 / total if total else 0.0
              gate = pct >= floors[f] - 1e-9
              ok = ok and gate
              rows.append('%-18s lines %5d/%-5d line coverage %5.2f%% (floor %4.1f%%) %s'
                          % (f, covered, total, pct, floors[f], 'OK' if gate else 'BELOW FLOOR'))
          om, oc = overall
          ot = om + oc
          rows.append('%-18s lines %5d/%-5d line coverage %5.2f%% (informational)'
                      % ('overall', oc, ot, oc * 100.0 / ot if ot else 0.0))
          rows.append('')
          rows.append('reports: neo/build/reports/jacoco/test/jacocoTestReport.xml (+ html/index.html)')

          out = ['### M3.6 core package line coverage (floors: core>=2%, lib>=73%)', '```'] + rows + ['```']
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write('\n'.join(out) + '\n')
          print('\n'.join(out))
          if not ok:
              print('M3.6 coverage summary: family below floor despite green gradle gate', file=sys.stderr)
              sys.exit(1)
          PYEOF
          exit $?

      # M3.7: headless runServer 冒烟 + 启动耗时（vanilla 口径 "Done (N.NNNs)!" 行 + wall-clock）。
      # runServer 不会自行退出，故后台启动（setsid 独立进程组）→ 轮询日志拿证据（300s 超时即失败）
      # → 解析后 kill 进程树（TERM → 最多 15s → KILL，再兜底 pkill devlaunch/GradleDaemon，保证 runner
      #   上不残留 java/gradle 进程）。成败判定不依赖被 kill 的 gradle 退出码（同 M3.1：先捕获 rc 再按
      #   日志证据裁决），以日志为权威、fail-closed：
      #   - 无 "Done (N.NNNs)!" 行（含轮询超时 / gradle 提前退出）→ 红
      #   - 8 个 mod 构造器 "(neo skeleton) loaded" 行任一缺失 → 红
      #   - crash 标记（"Failed to start" / "A fatal" / "Crash report" 行、生成 crash-report 文件、
      #     ERROR 级日志行非 0）→ 红
      # M2.8 OilWorldgenProbe 的 scan 行只作冒烟副证记录（最长等 60s），不参与判定。
      - name: Headless runServer smoke + startup time (M3.7)
        timeout-minutes: 10
        run: |
          cd neo
          # 幂等：全新 checkout 本无 world/crash-reports，跑前清一次保证全新世界 + 空崩溃报告目录
          rm -rf run/world run/crash-reports
          # 全新 checkout 首启没有 server.properties，vanilla 会打一条良性 ERROR（Failed to load properties，
          # FileNotFoundException 后走默认值）。预置空文件让首启干净（缺省键走 vanilla 默认值），
          # 从而保住下方 ERROR==0 门禁对真实异常的判别力（首次 CI 实跑验证过该 ERROR 必现）。
          mkdir -p run && touch run/server.properties
          pkill -9 -f devlaunch 2>/dev/null || true
          START=$(date +%s)
          setsid ./gradlew runServer --no-daemon > /tmp/m37-runserver.log 2>&1 &
          GPID=$!
          DEAD=0
          for i in $(seq 1 600); do
            grep -q 'Done (' /tmp/m37-runserver.log 2>/dev/null && break
            kill -0 "$GPID" 2>/dev/null || { DEAD=1; break; }
            sleep 0.5
          done
          END=$(date +%s)
          WALL=$((END - START))
          # M2.8 oil 扫描副证：只记录不判定
          for i in $(seq 1 120); do
            grep -q 'Oil worldgen scan' /tmp/m37-runserver.log 2>/dev/null && break
            sleep 0.5
          done
          # kill 进程树：TERM → 最多 15s → KILL → 兜底清扫
          kill -- -"$GPID" 2>/dev/null || true
          for i in $(seq 1 30); do
            kill -0 "$GPID" 2>/dev/null || break
            sleep 0.5
          done
          kill -9 -- -"$GPID" 2>/dev/null || true
          pkill -9 -f devlaunch 2>/dev/null || true
          pkill -9 -f org.gradle.launcher.daemon.bootstrap.GradleDaemon 2>/dev/null || true
          GRADLE_RC=0
          wait "$GPID" 2>/dev/null || GRADLE_RC=$?
          sleep 2
          LEFTOVER=$(pgrep -fc 'devlaunch|GradleDaemon' 2>/dev/null || true)
          M37_GRADLE_RC="$GRADLE_RC" M37_WALL="$WALL" M37_DEAD="$DEAD" M37_LEFTOVER="${LEFTOVER:-0}" \
          python3 - <<'PYEOF'
          import os, re, sys

          with open('/tmp/m37-runserver.log', encoding='utf-8', errors='replace') as f:
              log = f.read()
          lines = log.splitlines()

          wall = os.environ.get('M37_WALL', '?')
          gradle_rc = os.environ.get('M37_GRADLE_RC', '?')
          dead = os.environ.get('M37_DEAD', '0')
          leftover = int(os.environ.get('M37_LEFTOVER', '0') or 0)

          mods = [
              ('bu.li.BCLib', 'BuildCraft lib'),
              ('bu.co.BuildCraftCore', 'BuildCraft core'),
              ('bu.bu.BuildCraftBuilders', 'BuildCraft builders'),
              ('bu.en.BuildCraftEnergy', 'BuildCraft energy'),
              ('bu.fa.BuildCraftFactory', 'BuildCraft factory'),
              ('bu.si.BuildCraftSilicon', 'BuildCraft silicon'),
              ('bu.tr.BuildCraftTransport', 'BuildCraft transport'),
              ('bu.ro.BuildCraftRobotics', 'BuildCraft robotics'),
          ]

          problems = []
          m_done = re.search(r'Done \((\d+\.\d+)s\)', log)
          if not m_done:
              problems.append('no "Done (N.NNNs)!" line in log (gradle_died=%s, gradle_rc=%s)' % (dead, gradle_rc))

          mod_lines = []
          for logger, name in mods:
              needle = '[%s/]: %s (neo skeleton) loaded' % (logger, name)
              line = next((l for l in lines if needle in l), None)
              if line is None:
                  problems.append('missing mod load line: %s' % needle)
              else:
                  mod_lines.append(line.split(']: ', 1)[-1].strip())

          error_lines = [l for l in lines if '/ERROR]' in l]
          if error_lines:
              problems.append('%d ERROR-level log line(s), first: %s' % (len(error_lines), error_lines[0].strip()))

          crash_lines = [l for l in lines
                         if 'Failed to start' in l or 'A fatal' in l or 'Crash report' in l]
          if crash_lines:
              problems.append('crash marker line(s): %s' % crash_lines[0].strip())

          crash_dir = 'run/crash-reports'
          crash_reports = sorted(os.listdir(crash_dir)) if os.path.isdir(crash_dir) else []
          if crash_reports:
              problems.append('crash report file(s) generated: %s' % ', '.join(crash_reports))

          if leftover:
              problems.append('%d leftover devlaunch/GradleDaemon process(es) after kill' % leftover)

          oil = next((l for l in lines if 'Oil worldgen scan' in l), '(not seen within 60s, informational only)')
          oil_text = oil.split(']: ', 1)[-1].strip()

          rows = ['Done line (vanilla startup): %s' % (m_done.group(0) + '! For help, type "help"' if m_done else '<missing>'),
                  'wall-clock gradle start -> Done (CI 口径): %ss' % wall,
                  'mods loaded: %d/8' % len(mod_lines)]
          rows += ['  - ' + l for l in mod_lines]
          rows += ['ERROR-level log lines: %d' % len(error_lines),
                   'crash markers: %s' % ('none' if not crash_lines else crash_lines[0].strip()),
                   'M2.8 oil probe (informational): %s' % oil_text,
                   'gradle rc after kill: %s (expected nonzero, kill-induced; not a gate)' % gradle_rc]

          out = ['### M3.7 headless runServer smoke', '```'] + rows + ['```']
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write('\n'.join(out) + '\n')
          print('\n'.join(out))
          if problems:
              print('M3.7 smoke FAILED:', file=sys.stderr)
              for p in problems:
                  print(' - ' + p, file=sys.stderr)
              print('--- last 40 log lines ---', file=sys.stderr)
              print('\n'.join(lines[-40:]), file=sys.stderr)
              sys.exit(1)
          PYEOF
          exit $?

      # M3.8: 迁移仪表盘——趋势记录随 CI 自动更新。progress.py --trend 采集一条指标快照
      # （时间戳/commit/任务完成度/forge imports/java 规模/todo/fixme/onlyin_client/registryobject_files），
      # 追加进 migration/trends/metrics-history.jsonl 并刷新 metrics-latest.json，把关键指标打进
      # $GITHUB_STEP_SUMMARY，最后把趋势记录回写仓库。
      # fail-closed 只限指标采集本身：--trend 非 0、latest 快照读不出/非法 JSON，任一即红。
      # 回写是尽力而为（趋势记录不因竞态弄红构建）：
      #   - 只在 push 事件回写（PR 触发的 run 处于 merge ref，不能推回分支）；
      #   - commit 消息带 [skip ci] 防递归触发（GITHUB_TOKEN 的 push 本身也不会再触发 workflow，双保险）；
      #   - push 失败 → git pull --rebase 后重试一次 → 仍失败打印 "trend push skipped (race)" 以 0 退出
      #     （权限不足被拒也走此 skip 分支，如实打印不红）。
      - name: Migration trend record (M3.8)
        timeout-minutes: 5
        run: |
          python3 migration/scripts/progress.py --trend || exit 1
          python3 - <<'PYEOF'
          import json, os, sys

          try:
              with open('migration/trends/metrics-latest.json', encoding='utf-8') as f:
                  m = json.load(f)
          except (OSError, ValueError) as e:
              print('M3.8 trend summary: cannot read metrics-latest.json: %s' % e, file=sys.stderr)
              sys.exit(1)

          rows = ['timestamp: %s' % m.get('timestamp'),
                  'commit: %s' % m.get('commit'),
                  'tasks done: %s/%s (rate %s%%)' % (m.get('done'), m.get('total'), m.get('rate_pct')),
                  'forge imports: %s occurrences in %s files' % (m.get('forge_import_occurrences'), m.get('forge_import_files')),
                  'registry object files: %s' % m.get('registryobject_files'),
                  'java: %s lines in %s files' % (m.get('java_lines'), m.get('java_files')),
                  'todo/fixme: %s/%s' % (m.get('todo'), m.get('fixme')),
                  'only-in-client files: %s' % m.get('onlyin_client')]

          out = ['### M3.8 migration trend snapshot', '```'] + rows + ['```']
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write('\n'.join(out) + '\n')
          print('\n'.join(out))
          PYEOF
          # ---- 以下为趋势回写（尽力而为，不红） ----
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "trend push skipped (event: ${GITHUB_EVENT_NAME}; write-back only runs on push events)"
            exit 0
          fi
          git checkout -B neoforge-26.1.2
          git add migration/trends/
          if git diff --cached --quiet; then
            echo "trend record: nothing to commit"
            exit 0
          fi
          git -c user.name=bobyasasas -c user.email=bobyasasas@users.noreply.github.com \
            commit -m "chore: migration trend record [skip ci]"
          if git push origin neoforge-26.1.2; then
            echo "trend record pushed to origin/neoforge-26.1.2"
          else
            echo "trend push failed once, retrying after rebase" >&2
            if git pull --rebase origin neoforge-26.1.2 && git push origin neoforge-26.1.2; then
              echo "trend record pushed to origin/neoforge-26.1.2 (after rebase)"
            else
              git rebase --abort 2>/dev/null || true
              echo "trend push skipped (race)" >&2
            fi
          fi
          exit 0

      # M3.4: datagen 对拍——真 datagen（runData，GatherDataEvent.Server/Client + 8 mod provider）再生
      # 随包 assets 到独立目录 run/datagen（绝不写 src/main/resources），再由
      # migration/scripts/datagen_diff.py --strict 三方对拍：
      #   S1 无漂移: runData 产物 vs src/main/resources/assets 逐字节 diff=0（白名单 1 项手工模型）；
      #   S2/S3: 物品/blockstate id 与冻结 1.20.1 基线 buildcraft_resources_generated 对拍，
      #     白名单外 diff=0（1.20.1<->26.1.2 格式归一化规则显式登记在脚本头注，白名单逐项枚举 40 项）。
      # fail-closed：gradle 失败、datagen 启动证据行缺失、产物目录为空、diff 退出码非零，任一即红。
      - name: Datagen regeneration + no-drift baseline diff (M3.4)
        timeout-minutes: 15
        run: |
          cd neo
          set -o pipefail
          rm -rf run/datagen
          ./gradlew runData --no-daemon 2>&1 | tee /tmp/datagen.log
          data_rc=${PIPESTATUS[0]}
          if [ "$data_rc" -ne 0 ]; then
            echo "runData failed rc=$data_rc" >&2
            exit 1
          fi
          grep -q "Initializing Data Gatherer" /tmp/datagen.log || {
            echo "datagen evidence line missing (Data Gatherer did not start)" >&2
            exit 1
          }
          if [ ! -d run/datagen/assets ] || [ -z "$(ls -A run/datagen/assets)" ]; then
            echo "runData produced no assets under run/datagen/assets" >&2
            exit 1
          fi
          cd ..
          python3 migration/scripts/datagen_diff.py \
            neo/run/datagen/assets neo/src/main/resources/assets buildcraft_resources_generated/assets --strict \
            | tee /tmp/datagendiff.txt
          diff_rc=${PIPESTATUS[0]}
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "### M3.4 datagen parity (runData regeneration vs shipped assets vs 1.20.1 baseline, --strict)"
              echo '```'
              cat /tmp/datagendiff.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $diff_rc

      # M3.9: 生产启动冒烟——把"刚构建的 jar"放进真实 NeoForge 服务端（installer 安装，非 dev classpath），
      # 断言 8 mod 加载 + expression 冒烟执行 + Done。背景：dev 门禁（gametest/runServer 冒烟）的 classpath
      # 天然带 :expression 项目，曾放过一个缺 429 个 expression 类的 jar（用户实测 NoClassDefFoundError、
      # exit=1，复现于 2026-09-17），本门禁堵死该盲区：缺类/打包回归在这里必红。
      # NeoForge 版本不硬编码，读 neo/gradle.properties 的 neo_version（单一事实源）。
      - name: Production launch smoke of built jar (M3.9)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cd neo
          NEO_VERSION="$(grep '^neo_version=' gradle.properties | cut -d= -f2 | tr -d ' \r')"
          [ -n "$NEO_VERSION" ] || { echo "neo_version missing in gradle.properties" >&2; exit 1; }
          JAR="$(ls build/libs/buildcraftcore-*.jar 2>/dev/null | head -1)"
          [ -n "$JAR" ] || { echo "no built jar under build/libs" >&2; exit 1; }
          # 转 absolute（后续 cd /tmp 后仍可引用；JAR 此前相对 neo/，直接拼 GITHUB_WORKSPACE 会缺 neo/ 段）
          JAR="$(cd "$(dirname "$JAR")" && pwd)/$(basename "$JAR")"
          # run.sh 用 PATH 上的 java（CI 是 21），MC 26.1 需 Java 25：按序探测 Gradle 工具链
          # 下载目录（~/.gradle/jdks，本地形态）与 GitHub runner 预装 JDK 布局（/usr/lib/jvm、
          # /opt/hostedtoolcache）——Build 步骤的工具链解析必在其中某处命中 25（否则 build 早就红了），
          # 每个候选以 java -version 实证是 25 才采纳；全都找不到则打出工具链清单后变红（fail-closed）。
          JDK25=""
          for d in "$HOME"/.gradle/jdks/*25* /usr/lib/jvm/*25* /opt/hostedtoolcache/*/*25* /opt/hostedtoolcache/*25*; do
            [ -x "$d/bin/java" ] || continue
            if "$d/bin/java" -version 2>&1 | head -1 | grep -q 'version "25'; then
              JDK25="$d"; break
            fi
          done
          if [ -z "$JDK25" ]; then
            echo "no usable JDK 25 found; gradle toolchain inventory:" >&2
            ./gradlew -q javaToolchains >&2 || true
            exit 1
          fi
          echo "using NeoForge $NEO_VERSION, jar $(basename "$JAR"), java $($JDK25/bin/java -version 2>&1 | head -1) ($JDK25)"
          cd /tmp
          rm -rf m39-prod && mkdir -p m39-prod && cd m39-prod
          curl -fLo installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/$NEO_VERSION/neoforge-$NEO_VERSION-installer.jar"
          "$JDK25/bin/java" -jar installer.jar --installServer server
          mkdir -p server/mods
          cp "$GITHUB_WORKSPACE/$JAR" "server/mods/$(basename "$JAR")" || { echo "failed to stage jar into mods/" >&2; exit 1; }
          cd server
          echo "eula=true" > eula.txt
          # 空 server.properties：避免 vanilla 首启无配置文件的良性 ERROR 干扰判定（同 M3.7 理由）
          touch server.properties
          rm -rf world crash-reports logs
          START=$(date +%s)
          # 后台起服 + 轮询 Done（最多 480s），Done 即停——健康路径只需 1-2 分钟；
          # setsid 建独立进程组便于整组收尾（JVM 偶尔会脱离外层进程组，末尾另有 pkill 兜底）
          PATH="$JDK25/bin:$PATH" setsid ./run.sh --nogui > console.log 2>&1 &
          GPID=$!
          DEAD=0
          for i in $(seq 1 960); do
            grep -q 'Done (' console.log 2>/dev/null && break
            kill -0 "$GPID" 2>/dev/null || { DEAD=1; break; }
            sleep 0.5
          done
          END=$(date +%s)
          # 收尾：TERM 进程组 → 15s 宽限 → KILL → 按 m39-prod 路径兜底清扫（本 runner 上无他人进程）
          kill -- -"$GPID" 2>/dev/null || true
          for i in $(seq 1 30); do
            kill -0 -- -"$GPID" 2>/dev/null || break
            sleep 0.5
          done
          kill -9 -- -"$GPID" 2>/dev/null || true
          pkill -9 -f "m39-prod" 2>/dev/null || true
          problems=0
          grep -q 'Done (' console.log || { echo "M3.9 FAILED: no 'Done (' line" >&2; problems=1; }
          LOADED="$(grep -c 'neo skeleton) loaded' console.log || true)"
          [ "$LOADED" -eq 8 ] || { echo "M3.9 FAILED: expected 8 mod loaded lines, got $LOADED" >&2; problems=1; }
          grep -q 'expression smoke' console.log || { echo "M3.9 FAILED: expression smoke line missing (library not loading in production)" >&2; problems=1; }
          MISSING="$(grep -E 'NoClassDefFoundError|ClassNotFoundException' console.log | grep -vc kqueue || true)"
          [ "$MISSING" -eq 0 ] || { echo "M3.9 FAILED: $MISSING missing-class error lines (non-kqueue)" >&2; grep -E 'NoClassDefFoundError|ClassNotFoundException' console.log | grep -v kqueue >&2; problems=1; }
          if grep -q 'Failed to start the minecraft server' console.log; then
            echo "M3.9 FAILED: server reported startup failure" >&2; problems=1
          fi
          if [ -d crash-reports ] && [ -n "$(ls -A crash-reports)" ]; then
            echo "M3.9 FAILED: crash-reports present" >&2; problems=1
          fi
          # 已知良性（不算失败）：netty kqueue 原生传输是 macOS-only，Linux 上类初始化失败属预期回退，
          # 由 NeoForge DebugFile appender 打成一条 ERROR —— 与 BuildCraft 无关，服务器照常 Done 并监听。
          ERRORS="$(grep -c ' ERROR ' console.log || true)"
          KQUEUE="$(grep -c kqueue console.log || true)"
          DONE_LINE="$(grep 'Done (' console.log | head -1 || true)"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo '### M3.9 production launch smoke (installer server + built jar in mods/)'
              echo '```'
              echo "jar:            $(basename "$JAR")"
              echo "neoforge:       $NEO_VERSION"
              echo "mods loaded:    $LOADED/8"
              echo "done line:      $DONE_LINE"
              echo "wall seconds:   $((END - START))"
              echo "ERROR lines:    $ERRORS (known-benign kqueue/netty lines: $KQUEUE)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$problems" -ne 0 ]; then
            echo '--- last 40 console lines ---' >&2
            tail -40 console.log >&2 || true
            exit 1
          fi
          echo "M3.9 production smoke PASSED ($LOADED/8 mods, $DONE_LINE)"

      # 编译产物上传：每次 CI 构建出的 8-mod 一 jar（buildcraftcore-<mc>-<ver>.jar）挂到 run 页面供下载。
      # 若 build 成功但 libs 下没有 jar（打包配置回归），本步骤按 upload-artifact 的 if-no-files-found: error 变红。
      # 放在 M3.9 生产启动门禁之后：不可运行的 jar 不应出现在 run 页面供下载。
      - name: Upload built mod jar
        uses: actions/upload-artifact@v4
        with:
          name: buildcraft-neoforge-jar
          path: neo/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
