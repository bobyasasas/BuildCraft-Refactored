name: CI

on:
  push:
    branches: [neoforge-26.1.2]
  pull_request:
    branches: [neoforge-26.1.2]

# 同一分支/PR 的新推送取消仍在跑的旧 CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 校验 migration/tasks.json 的结构、状态枚举与 done 任务的 evidence 完整性
  progress-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run progress check
        run: python3 migration/scripts/progress.py --check

  # M0.2 完成前本 job 允许失败属预期（让基线构建变绿就是任务 M0.2），M0.2 完成后必须绿
  baseline-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # 本项目 BuildCraftAPI 等三个子模块是编译必需
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon
