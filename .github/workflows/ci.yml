name: CI

on:
  push:
    branches: [neoforge-26.1.2]
  pull_request:
    branches: [neoforge-26.1.2]

# 同一分支/PR 的新推送取消仍在跑的旧 CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 校验 migration/tasks.json 的结构、状态枚举与 done 任务的 evidence 完整性
  progress-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run progress check
        run: python3 migration/scripts/progress.py --check

  # M0.2 完成前本 job 允许失败属预期（让基线构建变绿就是任务 M0.2），M0.2 完成后必须绿
  baseline-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # 本项目 BuildCraftAPI 等三个子模块是编译必需
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      # M1.3: 覆盖率基线——build 已含 test，这里只产出 JaCoCo 报告（基线阶段不上门禁，M3.6 才设阈值）
      - name: Coverage report
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/
          retention-days: 14

  # M2.1: 并行的 NeoForge 26.1.2 独立构建（neo/，ModDevGradle），不依赖子模块
  neo-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 守护进程跑在 21 上；构建用的 Java 25 工具链由 foojay-resolver 自动下载
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build
        run: cd neo && ./gradlew build --stacktrace --no-daemon

      # M3.1: headless GameTests（gameTestServer run，选择器 buildcraftcore:*）。
      # 注意成败判定不能依赖 gradle 退出码：FML 的 net.neoforged.fml.startup.GameTestServer
      # 入口只有启动异常才 System.exit(1)，测试失败时 JVM 正常返回（已核对 loader 11.0.15 字节码）。
      # 因此以 GameTestServer 日志为权威信号（26.1 实际格式）：
      #   总数 = "Each test that matches ... will be run N times (total: M)"（兜底 "M GAME TESTS COMPLETE"）
      #   通过 = "All M required tests passed :)"（26.1 中通过用例不逐条打日志，失败用例才有 ERROR 行）
      #   解析不到通过行（含中途崩溃/环境故障）一律按 0/N 处理并以非零码退出，步骤变红。
      - name: GameTests (headless)
        timeout-minutes: 15
        run: |
          cd neo
          set -o pipefail
          rc=0
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee /tmp/gametest.log || rc=$?
          GT_GRADLE_RC="$rc" python3 - <<'PYEOF'
          import os, re, sys

          with open('/tmp/gametest.log', encoding='utf-8', errors='replace') as f:
              log = f.read()

          m_total = re.search(r'will be run \d+ times \(total: (\d+)\)', log)
          m_complete = re.search(r'=+ (\d+) GAME TESTS COMPLETE IN ', log)
          m_pass = re.search(r'All (\d+) required tests passed', log)

          total = int(m_total.group(1)) if m_total else (int(m_complete.group(1)) if m_complete else 0)
          passing = int(m_pass.group(1)) if m_pass else 0
          gradle_rc = int(os.environ.get('GT_GRADLE_RC', '1'))

          # 成功需同时满足：gradle 退出码 0 且日志出现 "All N required tests passed"（N == 总数）
          ok = gradle_rc == 0 and m_pass is not None and total > 0 and passing == total

          # 统计行 + 日志原文证据（汇总行；失败用例的 "xxx failed at ..." ERROR 行与 "- id: error" 清单行）
          out = ['GameTests: %d/%d passing' % (passing, total)]
          for raw in log.splitlines():
              text = raw.split(']: ', 1)[-1].rstrip()
              keep = ('GAME TESTS COMPLETE IN' in text
                      or 'required tests' in text
                      or 'optional tests failed' in text
                      or re.search(r'\S+ failed at ', text)
                      or re.match(r'\s*- \S+: ', text))
              if keep and text and text not in out:
                  out.append('> ' + text)
          out.append('')

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write('\n'.join(out) + '\n')
          print('\n'.join(out))
          sys.exit(0 if ok else 1)
          PYEOF
          exit $?

      # M3.3: registry dump + 与冻结 1.20.1 基线对拍。流程：带 -Pregistrydump.path 重跑 runGameTestServer
      # （RegistryDumpProbe 在 ServerStartedEvent 把 26.1.2 运行时注册表落盘成与基线同 schema 的 JSON：
      #   五类注册表 + recipes + tags），再跑 migration/scripts/registry_diff.py 判定：
      #   - 五类注册表：missing=0 且 extra=0（按 RegistryParityTest.EXTRA_WHITELIST 的 4 个 M2.2 垂直切片
      #     id 扣除后）才绿，与 buildcraftcore:registry_parity gametest 语义逐字一致；
      #   - recipes/tags：quantify-only——缺口不算红，但精确计数随完整 diff 输出打进 $GITHUB_STEP_SUMMARY
      #     （内容移植任务收口时给 diff 加 --strict 收紧为全量判定）。
      # fail-closed：gradle 失败、dump 证据行缺失、diff 退出码非零，任一都让本步骤变红。
      - name: Registry parity diff vs 1.20.1 baseline (M3.3)
        timeout-minutes: 15
        run: |
          cd neo
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon -Pregistrydump.path="$PWD/build/registry-dump-26.1.2.json" 2>&1 | tee /tmp/registrydump.log
          dump_rc=$?
          if [ "$dump_rc" -ne 0 ]; then
            echo "runGameTestServer (registry dump) failed rc=$dump_rc" >&2
            exit 1
          fi
          grep -q "Registry dump written:" /tmp/registrydump.log || {
            echo "registry dump evidence line missing (probe did not write the dump)" >&2
            exit 1
          }
          cd ..
          python3 migration/scripts/registry_diff.py neo/build/registry-dump-26.1.2.json migration/snapshots/registry-baseline.json | tee /tmp/registrydiff.txt
          diff_rc=${PIPESTATUS[0]}
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "### M3.3 registry parity (26.1.2 runtime vs frozen 1.20.1 baseline)"
              echo '```'
              cat /tmp/registrydiff.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $diff_rc
